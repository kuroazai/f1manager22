name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because that is where this tool runs, and
        # because the bug it most recently fixed was a path with a space in it.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        # No game, no save file and no unpacker. The suite builds a SQLite
        # database from f1manager22.schema and stubs the unpacker with a small
        # script, so every statement is exercised against real SQLite.
        run: pytest --cov=f1manager22 --cov-report=term-missing

      - name: The CLI is installed and runs
        run: f1m22 preview --preset racing
